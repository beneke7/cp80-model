name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-14 }
          - { name: Windows, os: windows-2022 }
          - { name: Linux,   os: ubuntu-22.04 }

    # Job-level env, because the `secrets` context is not available in a step `if`.
    # Empty on forks and on any repo without the secrets set, which skips signing.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      # JUCE 8 on Linux. Web browser and cURL are compiled out (see plugin/CMakeLists.txt),
      # so webkit2gtk and libcurl are deliberately absent from this list.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      # The JUCE clone dominates configure time; key on the pinned tag.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.12-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          args=(-S plugin -B build
                -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
                -DCP80_COPY_AFTER_BUILD=OFF)
          # Quoted: the semicolon is a CMake list separator, not a shell one.
          [ "$RUNNER_OS" = "macOS" ] && args+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      # ---------------------------------------------------------------- macOS signing
      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          rm -f /tmp/cert.p12

      - name: Sign and notarize
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          IDENTITY:   ${{ secrets.MACOS_SIGN_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY:    ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          cd "build/CP80_artefacts/$BUILD_TYPE"
          bundles=(VST3/CP-80.vst3 AU/CP-80.component Standalone/CP-80.app)
          for b in "${bundles[@]}"; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
          echo "$API_KEY" | base64 --decode > /tmp/key.p8
          # notarytool takes archives, not raw bundles. One submission covers all three.
          ditto -c -k --keepParent --sequesterRsrc VST3/CP-80.vst3 /tmp/n1.zip
          ditto -c -k --keepParent --sequesterRsrc AU/CP-80.component /tmp/n2.zip
          ditto -c -k --keepParent --sequesterRsrc Standalone/CP-80.app /tmp/n3.zip
          for z in /tmp/n1.zip /tmp/n2.zip /tmp/n3.zip; do
            xcrun notarytool submit "$z" --wait \
              --key /tmp/key.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          done
          for b in "${bundles[@]}"; do xcrun stapler staple "$b"; done
          rm -f /tmp/key.p8 /tmp/n?.zip

      # ---------------------------------------------------------------- artefacts
      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          cd "build/CP80_artefacts/$BUILD_TYPE"
          for f in VST3/CP-80.vst3 AU/CP-80.component \
                   Standalone/CP-80.app Standalone/CP-80.exe Standalone/CP-80; do
            if [ -e "$f" ]; then cp -R "$f" "$GITHUB_WORKSPACE/dist/"; fi
          done
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: CP-80-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip per platform
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qry "../${d%/}.zip" .); done
          ls -la *.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip
          --repo "$GITHUB_REPOSITORY" --generate-notes
